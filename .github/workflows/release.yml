name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release-mac:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fail fast when the tag does not match the app version, otherwise
      # electron-builder publishes artifacts to the wrong release.
      - name: Verify tag matches app version
        run: |
          APP_VERSION="$(node -p "require('./apps/electron-app/package.json').version")"
          if [ "v${APP_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match app version ${APP_VERSION}. Bump apps/electron-app/package.json first."
            exit 1
          fi

      # Reset the release so electron-builder's parallel upload tasks never
      # race to create it (422 already_exists) and re-runs produce clean
      # assets instead of failing on leftovers.
      - name: Reset GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --yes || true
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" --generate-notes

      - name: Build & publish (mac)
        working-directory: apps/electron-app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub macOS runners default to a 256 fd soft limit; ad-hoc signing
          # reads every bundled file and hits EMFILE. Raise to the hard limit.
          ulimit -n 10240
          pnpm install:services
          pnpm build
          pnpm exec electron-builder --mac --publish always

      # electron-builder's GitHub publisher can leave artifacts on a separate
      # DRAFT release (drafts are invisible to unauthenticated users and to
      # /releases/latest). Rebuild the release deterministically: drop every
      # release for this tag, then create one published release uploading
      # artifacts straight from dist/.
      - name: Finalize release (publish + verify assets)
        working-directory: apps/electron-app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          for id in $(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"${TAG}\") | .id"); do
            echo "deleting release ${id}"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"
          done

          shopt -s nullglob
          FILES=(dist/*.dmg dist/*.zip dist/*.blockmap dist/*.yml)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::error::no build artifacts found in dist/"
            exit 1
          fi
          gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" \
            --title "${TAG}" --generate-notes "${FILES[@]}"

          # The by-tag endpoint 404s for drafts, so a hit proves the release
          # is public and carries assets.
          for i in 1 2 3 4 5 6; do
            ASSETS="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
              --jq '.assets[].name' 2>/dev/null || true)"
            if echo "${ASSETS}" | grep -q '\.dmg$'; then
              echo "release ${TAG} is public with assets:"
              echo "${ASSETS}"
              exit 0
            fi
            sleep 5
          done
          echo "::error::release ${TAG} is not publicly visible with dmg assets"
          exit 1
