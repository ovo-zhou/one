appId: com.one.faceless
productName: Faceless
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!scripts/*'
  - '!resources/services/*'
asarUnpack:
  - resources/**
afterPack: scripts/after-pack.js
extraResources:
  - from: resources/services
    to: services
    filter:
      - '!package.json'
      - '!node_modules'
  - from: resources/windowlist
    to: windowlist
    filter:
      - '!*.swift'
  - from: resources/selectionwatch
    to: selectionwatch
    filter:
      - '!*.swift'
win:
  executableName: faceless
nsis:
  artifactName: faceless-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  # Ad-hoc signature ("-" signs with a local ad-hoc identity; null would skip
  # signing entirely and produce a bundle Gatekeeper rejects as "damaged").
  # Unsigned downloads degrade to a "cannot verify developer" prompt
  # (right-click -> Open) instead of the "app is damaged" Gatekeeper error.
  identity: "-"
  hardenedRuntime: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
  notarize: false
  artifactName: faceless-${version}-${arch}.${ext}
  target:
    - dmg
    - zip
linux:
  artifactName: faceless-${version}-${arch}.${ext}
  target:
    - AppImage
    - deb
  maintainer: ryan
  category: Utility
npmRebuild: false
publish:
  provider: github
  owner: ovo-zhou
  repo: one
  releaseType: release
